version: '3.8'

services:
  vanguard-ops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanguard-ops-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=vanguard-ops-super-secret-key-2026
      - DATA_DIR=/app/data
    volumes:
      - relief_database:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  relief_database:
    name: vanguard_relief_data
