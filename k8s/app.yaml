apiVersion: v1
kind: ConfigMap
metadata:
  name: relief-management
data:
  NODE_ENV: production
  PORT: "5000"
  DATA_DIR: /app/data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: relief-management-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relief-management
  labels:
    app: relief-management
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relief-management
  template:
    metadata:
      labels:
        app: relief-management
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relief-management
          image: ghcr.io/riyashah3006/relief-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: relief-management
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: relief-management
                  key: jwt-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: relief-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: relief-data
          persistentVolumeClaim:
            claimName: relief-management-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: relief-management
spec:
  type: ClusterIP
  selector:
    app: relief-management
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
