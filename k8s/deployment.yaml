apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-ops-deployment
  namespace: relief-system
  labels:
    app: vanguard-ops
    tier: frontend-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vanguard-ops
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vanguard-ops
    spec:
      containers:
        - name: vanguard-ops-container
          image: riyashah3006/relief-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATA_DIR
              value: "/app/data"
            - name: JWT_SECRET
              value: "vanguard-ops-super-secret-key-2026"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: database-storage
              mountPath: /app/data
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: vanguard-db-pvc
