apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vanguard-ops-ingress
  namespace: relief-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: relief.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vanguard-ops-service
                port:
                  number: 5000
